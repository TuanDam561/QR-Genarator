<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tạo, tải và đọc mã QR từ ảnh ngay trên trình duyệt." />
  <title>Tạo & quét mã QR</title>
  <link rel="stylesheet" href="./style.css" />
  <script defer src="./vendor/qrcode.min.js"></script>
  <script defer src="./vendor/jsQR.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="container">
    <header><h1>Tạo & quét mã QR</h1><p>Đổi link thành QR, đọc QR thành link.</p></header>
    <div class="panels">
      <section class="panel" aria-labelledby="createHeading">
        <h2 id="createHeading">Tạo mã QR</h2>
        <form id="createForm">
          <label for="qrText">Link hoặc nội dung</label>
          <input type="text" id="qrText" placeholder="https://example.com" required />
          <button type="submit">Tạo QR</button>
        </form>
        <div id="qrcode" aria-label="Mã QR đã tạo"></div>
        <button type="button" id="downloadButton" class="secondary" disabled>Tải QR xuống (PNG)</button>
        <p id="createStatus" class="status" role="status"></p>
      </section>
      <section class="panel" id="scanPanel" aria-labelledby="scanHeading">
        <h2 id="scanHeading">Quét QR từ ảnh</h2>
        <div id="dropZone" class="drop-zone">
          <label for="qrFile">Chọn ảnh có mã QR</label>
          <input type="file" id="qrFile" accept="image/*" aria-describedby="uploadHelp" />
          <p id="uploadHelp">Hoặc kéo thả ảnh vào đây, nhấn Ctrl + V / ⌘ + V để dán ảnh.</p>
          <button type="button" id="pasteButton" class="secondary">Dán ảnh từ bộ nhớ tạm</button>
        </div>
        <p class="hint">Ảnh được đọc ngay trên thiết bị, không tải lên máy chủ. Tối đa 20 MB / ảnh.</p>
        <p id="scanStatus" class="status" role="status" aria-live="polite"></p>
        <img id="scanPreview" alt="Ảnh QR bạn vừa chọn" hidden />
        <div id="scanResult" hidden>
          <label for="resultText">Nội dung trong QR</label>
          <textarea id="resultText" rows="3" readonly spellcheck="false"></textarea>
          <div class="actions">
            <button type="button" id="copyButton" class="secondary">Sao chép</button>
            <a id="openLink" class="button" target="_blank" rel="noopener noreferrer" hidden>Mở link</a>
          </div>
        </div>
      </section>
    </div>
    <noscript>Vui lòng bật JavaScript để tạo và quét mã QR.</noscript>
  </main>
</body>
</html>
